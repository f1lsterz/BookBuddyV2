name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format:check

      - name: Unit tests (policies + application layer)
        run: pnpm run test:unit:extended

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: docker compose up -d

      - name: Mongo replica sets (transactions / outbox)
        run: pnpm run infra:replset

      - name: RabbitMQ domain DLX / DLQ
        run: pnpm run infra:rabbit

      - name: Environment files
        run: pnpm run setup:env

      - name: Mongo migrations
        run: pnpm run migrate

      - name: Build
        run: pnpm run build

      - name: Seed book catalog
        run: pnpm run seed:books

      - name: E2E (stack + HTTP tests)
        run: node tooling/scripts/e2e-run.mjs
